name: Create release branch on publish

on:
  release:
    types:
      - released

permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch matching release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not a main release tag (vMAJOR.MINOR.PATCH) — skipping"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$TAG" >/dev/null 2>&1; then
            echo "Branch $TAG already exists — skipping"
            exit 0
          fi

          SHA=$(git rev-parse "refs/tags/$TAG")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin "$SHA:refs/heads/$TAG"
